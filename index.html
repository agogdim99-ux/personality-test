<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나를 알아가는 시간 · 성향 테스트</title>
<meta name="description" content="나, 연애하는 나, 결혼한 나 — 친구·연인·배우자와 함께 비교해보는 성향 테스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#fff7fb; --card:#ffffff; --ink:#4a4458; --sub:#8b829c; --line:#f1e6f3;
    --accent:#ff8fb8; --accent-soft:#ffd6e6;
  }
  body.m-self{--accent:#a98bff;--accent-soft:#e6dcff}
  body.m-love{--accent:#ff8fb8;--accent-soft:#ffd6e6}
  body.m-marry{--accent:#5fcfa6;--accent-soft:#cdf4e4}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);background:var(--bg);
    background-image:radial-gradient(circle at 10% 10%,#ffe3ef 0,transparent 40%),radial-gradient(circle at 90% 30%,#e9e1ff 0,transparent 40%),radial-gradient(circle at 30% 95%,#d9f6ea 0,transparent 40%);
    background-attachment:fixed;min-height:100vh}
  .wrap{max-width:440px;margin:0 auto;padding:24px 16px 48px;min-height:100vh}
  .screen{display:none;animation:fade .4s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
  .card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 6px 24px rgba(180,150,200,.15);margin-bottom:16px}
  .btn{display:block;width:100%;border:none;border-radius:18px;padding:16px;font-family:'Jua',sans-serif;font-size:18px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .1s}
  .btn:active{transform:translateY(2px)}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .btn+.btn{margin-top:10px}
  .muted{color:var(--sub);font-size:14px;line-height:1.6}

  /* home */
  @keyframes bob{50%{transform:translateY(-8px)}}
  #home{font-family:'Pretendard',-apple-system,sans-serif;position:relative;padding-top:8px}
  .h-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;color:#a79fb6;font-weight:600;margin-bottom:26px}
  .h-top i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
  .h-top i::before{content:'';width:6px;height:6px;border-radius:50%;background:#c9a8ff}
  .orbs{position:relative;height:150px;margin:0 auto 22px;width:220px}
  .orb{position:absolute;width:112px;height:112px;border-radius:50%;mix-blend-mode:multiply;filter:blur(.3px);animation:drift 7s ease-in-out infinite}
  .orb.o1{left:6px;top:4px;background:radial-gradient(circle at 35% 30%,#efe6ff,#c9b3ff)}
  .orb.o2{right:6px;top:4px;background:radial-gradient(circle at 35% 30%,#ffe9f1,#ffb3cf);animation-delay:-2.3s}
  .orb.o3{left:54px;top:40px;background:radial-gradient(circle at 35% 30%,#e3fbf1,#a6e9cd);animation-delay:-4.6s}
  @keyframes drift{50%{transform:translate(0,-6px) scale(1.03)}}
  .orbs span{position:absolute;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 1px 4px rgba(120,90,160,.35)}
  .h-title{font-size:34px;line-height:1.22;font-weight:800;letter-spacing:-.035em;color:#3d3550;text-align:center}
  .h-title em{font-style:normal;background:linear-gradient(90deg,#a98bff,#ff8fb8 55%,#5fcfa6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .h-sub{text-align:center;font-size:14.5px;line-height:1.65;color:#8b829c;margin:12px 0 30px;letter-spacing:-.01em}
  .m-label{font-size:12px;font-weight:700;letter-spacing:.12em;color:#b2a9c2;margin:0 4px 10px}
  .mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:16px 16px 16px 14px;margin-bottom:12px;font-family:inherit;color:#3d3550;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 2px rgba(90,70,120,.04),0 10px 30px -12px rgba(120,90,160,.22);transition:transform .2s,box-shadow .2s}
  .mode:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(90,70,120,.04),0 16px 34px -12px rgba(120,90,160,.3)}
  .mode:active{transform:scale(.985)}
  .mode .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mode .ic svg{width:24px;height:24px}
  .mode.self .ic{background:#f0e9ff;color:#8d6cf0}
  .mode.love .ic{background:#ffe8f0;color:#f0709f}
  .mode.marry .ic{background:#e2f7ee;color:#3fb98c}
  .mode .tx{flex:1;min-width:0}
  .mode .no{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:#b8b0c6;margin-bottom:2px}
  .mode b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
  .mode span.d{display:block;font-size:13px;color:#8b829c;letter-spacing:-.01em}
  .mode .go{width:30px;height:30px;border-radius:50%;background:#f6f2fa;display:flex;align-items:center;justify-content:center;color:#9d93ad;flex-shrink:0;transition:background .2s,color .2s}
  .mode:hover .go{background:#3d3550;color:#fff}
  .h-foot{display:flex;justify-content:center;gap:18px;margin-top:26px;font-size:12px;color:#a79fb6}
  .h-foot b{display:block;font-size:17px;color:#3d3550;font-weight:800;text-align:center}

  /* intro */
  .invite{background:var(--accent-soft);border-radius:18px;padding:14px 16px;margin-bottom:16px;font-size:15px;line-height:1.6}
  input[type=text]{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-family:inherit;outline:none;margin:10px 0 16px;color:var(--ink)}
  input[type=text]:focus{border-color:var(--accent)}
  .back{background:none;border:none;color:var(--sub);font-family:inherit;font-size:15px;cursor:pointer;padding:4px 0 14px}

  /* quiz */
  .prog{height:12px;background:#fff;border-radius:99px;overflow:hidden;margin:6px 0 8px;box-shadow:inset 0 0 0 2px var(--line)}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:14px}
  .cheer{text-align:center;font-family:'Jua';font-size:15px;color:var(--accent);min-height:22px;margin:2px 0 6px}
  .cheer.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .qcard{text-align:center;padding:26px 20px}
  .qcard .qe{font-size:46px;margin-bottom:10px}
  .qcard h2{font-size:21px;line-height:1.45;word-break:keep-all}
  .ans{display:flex;gap:10px;align-items:center;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 14px;margin-bottom:10px;font-family:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;text-align:left;line-height:1.5;word-break:keep-all;transition:all .15s}
  .ans .k{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:'Jua';display:flex;align-items:center;justify-content:center;font-size:15px}
  .ans:hover{border-color:var(--accent)}
  .ans.pick{background:var(--accent-soft);border-color:var(--accent)}
  .ans.pick .k{background:var(--accent);color:#fff}

  /* loading */
  .load{text-align:center;padding-top:30vh}
  .load .dots{font-size:44px;animation:bob 1s ease-in-out infinite}

  /* result */
  .rhead{text-align:center;background:linear-gradient(160deg,var(--accent-soft),#fff);padding:28px 20px}
  .rhead .tag{display:inline-block;background:#fff;border-radius:99px;padding:5px 14px;font-size:13px;color:var(--sub);margin-bottom:10px}
  .rhead .char{font-size:84px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
  .rhead .type{font-family:'Jua';font-size:42px;letter-spacing:3px;color:var(--accent);margin-top:6px}
  .rhead h2{font-size:24px;margin:2px 0 8px}
  .rhead p{font-size:15px;line-height:1.6;word-break:keep-all}
  .sec h3{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .sec h4{font-family:'Jua';font-weight:400;font-size:16px;margin:16px 0 8px}
  .sec p{font-size:15px;line-height:1.8;word-break:keep-all}
  .sec ul{list-style:none}
  .sec li{position:relative;background:#fff6f0;border-radius:14px;padding:11px 12px 11px 34px;margin-bottom:8px;font-size:14.5px;line-height:1.6;word-break:keep-all}
  .sec li::before{content:'😣';position:absolute;left:10px;top:11px;font-size:14px}
  .why{background:var(--accent-soft);border-radius:16px;padding:14px;margin-top:4px}
  .axis{margin-bottom:14px}
  .axis .lbl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .axis .lbl b{font-family:'Jua';font-weight:400;font-size:15px}
  .bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#f3eef7}
  .bar .l{background:var(--accent)}
  .bar .r{background:#e4dcef}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px}
  .pal{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;margin-bottom:10px}
  .pal.easy{background:#eefaf4}
  .pal.adj{background:#fff4ea}
  .pal .em{font-size:30px;display:flex;gap:2px}
  .pal b{font-family:'Jua';font-weight:400;font-size:16px}
  .pal small{display:block;font-size:13.5px;line-height:1.6;color:#6d6480;margin-top:3px;word-break:keep-all}
  .pill{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin-bottom:6px;font-family:'Jua'}
  .easy .pill{background:#bdf0dc;color:#2f8c6a}
  .adj .pill{background:#ffd9b5;color:#b86a1e}

  /* compare */
  .vs{display:flex;align-items:center;justify-content:space-around;text-align:center;margin:6px 0 14px}
  .vs .p{flex:1}
  .vs .p .e{font-size:50px}
  .vs .p .n{font-size:14px;color:var(--sub)}
  .vs .p .t{font-family:'Jua';font-size:22px;color:var(--accent)}
  .vs .heart{font-size:26px}
  .chem{text-align:center;background:var(--accent-soft);border-radius:18px;padding:14px;margin-bottom:16px}
  .chem .s{font-family:'Jua';font-size:34px;color:var(--accent)}
  .chem .ttl{font-family:'Jua';font-size:19px}
  .cmp{padding:12px 0;border-top:1px dashed var(--line)}
  .cmp .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
  .cmp .row .who{width:52px;flex-shrink:0;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmp .row .bar{flex:1;height:12px}
  .cmp .row .bar.them .l{background:#ffc38f}
  .cmp .row .v{width:46px;text-align:right;font-family:'Jua'}
  .cmp .h{display:flex;justify-content:space-between;font-family:'Jua';font-size:15px}
  .cmp .same{font-size:12px;border-radius:99px;padding:2px 8px;background:#e7f9f0;color:#2f8c6a}
  .cmp .diff{font-size:12px;border-radius:99px;padding:2px 8px;background:#fff0e2;color:#b86a1e}
  .cmp p{font-size:14px;line-height:1.65;margin-top:6px;word-break:keep-all}
  .share-box{background:var(--accent-soft);border-radius:20px;padding:18px;text-align:center}
  .share-box p{font-size:14.5px;line-height:1.6;margin-bottom:12px;word-break:keep-all}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:#4a4458;color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;transition:transform .3s,opacity .3s;z-index:9;white-space:nowrap;opacity:0;pointer-events:none}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}
  .linkbox{word-break:break-all;font-size:12px;background:#fff;border-radius:12px;padding:10px;margin-top:10px;display:none;text-align:left}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section class="screen on" id="home">
    <div class="h-top"><i>PERSONALITY TEST</i><span>Vol.1</span></div>
    <div class="orbs">
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <span style="left:34px;top:38px">ME</span><span style="right:30px;top:38px">LOVE</span><span style="left:92px;top:118px">HOME</span>
    </div>
    <h1 class="h-title">나를 알아가는<br><em>조용한 시간</em></h1>
    <p class="h-sub">17개의 상황 속 선택으로 알아보는 나,<br>그리고 함께하는 사람과의 우리</p>
    <div class="m-label">CHOOSE YOUR TEST</div>
    <button class="mode self" onclick="pickMode('self')">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3.2-2.4-5-5.6-5 0 3.2 2.4 5 5.6 5z"/></svg></div>
      <div class="tx"><span class="no">01 · 친구와 비교</span><b>나 파악하기</b><span class="d">평소의 나는 어떤 사람일까?</span></div>
      <div class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </button>
    <button class="mode love" onclick="pickMode('love')">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div>
      <div class="tx"><span class="no">02 · 연인과 비교</span><b>연애하는 나 파악하기</b><span class="d">사랑할 때 나는 어떻게 변할까?</span></div>
      <div class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </button>
    <button class="mode marry" onclick="pickMode('marry')">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></div>
      <div class="tx"><span class="no">03 · 부부가 함께</span><b>결혼한 나 파악하기</b><span class="d">함께 사는 나는 어떤 배우자일까?</span></div>
      <div class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </button>
    <div class="h-foot"><div><b>17</b>문항</div><div><b>3분</b>소요</div><div><b>16</b>가지 유형</div></div>
    <footer style="margin-top:22px">재미로 보는 테스트예요. 정답은 없어요.</footer>
  </section>

  <!-- INTRO -->
  <section class="screen" id="intro">
    <button class="back" onclick="goHome()">← 처음으로</button>
    <div id="inviteBox"></div>
    <div class="card" style="text-align:center">
      <div style="font-size:54px" id="introIc"></div>
      <h2 style="font-size:24px;margin:6px 0" id="introTitle"></h2>
      <p class="muted" id="introDesc"></p>
    </div>
    <div class="card">
      <label class="jua" style="font-size:17px">닉네임을 알려주세요</label>
      <input type="text" id="nick" maxlength="10" placeholder="예) 말랑이">
      <button class="btn" onclick="startQuiz()">시작하기 ✨</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="qtop"><button class="back" style="padding:0" onclick="prevQ()">← 이전</button><span id="qnum"></span></div>
    <div class="prog"><i id="progBar"></i></div>
    <div class="cheer" id="cheer"></div>
    <div class="card qcard"><div class="qe" id="qEmoji"></div><h2 id="qText"></h2></div>
    <div id="answers"></div>
  </section>

  <!-- LOADING -->
  <section class="screen" id="loading">
    <div class="load"><div class="dots">🔮</div><h2 style="margin-top:14px">마음을 들여다보는 중…</h2></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result"></section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 모드 ===================== */
const MODES = {
  self:  {ic:'🌱', title:'나 파악하기', who:'친구', desc:'일상, 청소, 일하는 순간까지 17가지 상황!<br>가장 나다운 선택을 골라주세요.<br>끝나면 친구에게 보내서 서로 비교할 수 있어요.', sec:'친구로서의 나', secIc:'🤝'},
  love:  {ic:'💗', title:'연애하는 나 파악하기', who:'연인', desc:'연애 중 만나는 17가지 상황!<br>솔직하게 골라야 정확해요 😉<br>끝나면 연인에게 보내서 우리 케미를 확인해봐요.', sec:'연애할 때의 나', secIc:'💌'},
  marry: {ic:'🏡', title:'결혼한 나 파악하기', who:'배우자', desc:'함께 사는 일상 속 17가지 상황.<br>집안일, 돈, 양가 이야기까지!<br>부부가 각자 해보고 결과를 같이 봐요.', sec:'배우자로서의 나', secIc:'🏡'}
};

/* ===================== 질문 =====================
   ax: 0=E/I 1=S/N 2=T/F 3=J/P
   각 선택지 [문장, 점수]  +2/+1 → 앞 글자(E,S,T,J) / -1/-2 → 뒷 글자(I,N,F,P) */
const Q = {
  self: [
    {ax:0,e:'🌙',q:'기다리던 금요일 저녁! 나의 선택은?',o:[
      ['단톡방에 "오늘 콜?" 던지고 제일 먼저 나간다',2],['누가 부르면 못 이기는 척 나간다',1],['배달 음식 + 넷플릭스, 이게 진짜 불금이지',-1],['이미 잠옷 입었음. 아무도 날 찾지 마',-2]]},
    {ax:1,e:'🎬',q:'친구가 "어제 본 영화 어땠어?" 하고 묻는다',o:[

  1:{same:'세상을 보는 눈이 비슷해서 대화가 잘 통하고, 말하지 않아도 알아듣는 순간이 많아요.',
     diff:{self:'한 명은 현실 이야기, 한 명은 상상 이야기를 좋아해요. 서로의 세계를 구경하는 재미가 있어요!',
           love:'선물과 기념일에서 차이가 나요. 실용 + 의미, 둘 다 챙기면 최고의 커플이에요.',
           marry:'한 명은 디테일, 한 명은 큰 그림 담당! 역할을 나누면 찰떡 팀이 돼요.'}},
  2:{same:'결정하고 표현하는 방식이 비슷해서, 서로의 반응이 예상 가능하고 오해가 적어요.',
     diff:{self:'고민 상담 때 "해결책 vs 공감"으로 엇갈릴 수 있어요. "지금 조언이 필요해, 위로가 필요해?" 먼저 물어봐 주세요.',
           love:'다툴 때 논리와 감정이 엇갈리기 쉬워요. 감정을 먼저 인정하고 → 그다음에 해결하는 순서로!',
           marry:'큰 결정에서 숫자와 마음이 부딪힐 수 있어요. 서로가 놓치는 쪽을 채워주는 든든한 사이예요.'}},
  3:{same:'생활 리듬이 비슷해서 약속, 일정, 청소 습관까지 자연스럽게 맞아요.',
     diff:{self:'약속 잡는 스타일이 달라요. 큰 틀만 정하고 세부 일정은 자유롭게 두면 편해요.',
           love:'계획 담당과 즉흥 이벤트 담당! 서로의 방식으로 데이트를 번갈아 준비해보세요.',
           marry:'집안일과 정리 방식이 달라요. 꼭 지킬 규칙 몇 개만 정하고 나머지는 유연하게!'}}
};

const CHEM = [
  {t:'정반대의 매력',d:'서로 완전히 다른 세계! 처음엔 낯설지만, 서로가 가장 많은 걸 배울 수 있는 사이예요.'},
  {t:'서로를 채워주는 사이',d:'다른 점이 더 많아서, 내가 못 하는 걸 상대가 해줘요. 대화가 곧 케미의 비결!'},
  {t:'서로 배우는 사이',d:'닮은 점 반, 다른 점 반. 편안함과 새로움을 함께 느낄 수 있는 균형 잡힌 관계예요.'},
  {t:'편안한 단짝',d:'대부분 잘 맞아서 함께 있으면 편안해요. 다른 한 가지가 관계에 재미를 더해줘요.'},
  {t:'거울 같은 사이',d:'생각도 리듬도 똑 닮았어요! 말하지 않아도 통하는 사이. 가끔은 서로에게 새로운 자극도 주세요.'}
];

/* ===================== 상태 ===================== */
let mode = null, nick = '', answers = [], qi = 0, invite = null;

const $ = id => document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
function setMode(m){mode=m;document.body.className='m-'+m}

function goHome(){
  invite=null;history.replaceState(null,'',location.pathname);
  document.body.className='';show('home');
}

function pickMode(m){
  setMode(m);
  const M=MODES[m];
  $('introIc').textContent=M.ic;$('introTitle').textContent=M.title;$('introDesc').innerHTML=M.desc;
  $('inviteBox').innerHTML = invite ? `<div class="invite">💌 <b>${esc(invite.name)}</b>님이 ‘${M.title}’ 결과를 보냈어요!<br>나도 테스트하면 <b>서로의 결과를 비교</b>해볼 수 있어요.</div>` : '';
  show('intro');setTimeout(()=>$('nick').focus(),300);
}

function startQuiz(){
  nick=$('nick').value.trim()||'나';
  answers=[];qi=0;renderQ();show('quiz');
}

/* 문항마다 고정된 순서로 선택지를 섞기 (이전으로 돌아가도 같은 순서) */
function order(i){
  const seeds=[[0,1,2,3],[2,0,3,1],[1,3,0,2],[3,2,1,0],[0,2,1,3],[2,3,0,1],[1,0,3,2],[3,1,2,0]];
  return seeds[(i*5+3)%seeds.length];
}

function renderQ(){
  const list=Q[mode],q=list[qi];
  $('qnum').textContent=`${qi+1} / ${list.length}`;
  $('progBar').style.width=(qi/list.length*100)+'%';
  const c=$('cheer');c.textContent=CHEER[qi]||'';c.classList.remove('pop');if(CHEER[qi]){void c.offsetWidth;c.classList.add('pop')}
  $('qEmoji').textContent=q.e;$('qText').textContent=q.q;
  const keys=['A','B','C','D'];
  $('answers').innerHTML=order(qi).map((oi,n)=>{
    const [t,w]=q.o[oi];const picked=answers[qi]===w?' pick':'';
    return `<button class="ans${picked}" onclick="answer(${w},this)"><span class="k">${keys[n]}</span><span>${esc(t)}</span></button>`;
  }).join('');
}

function answer(w,el){
  document.querySelectorAll('.ans').forEach(b=>b.classList.remove('pick'));
  el.classList.add('pick');
  answers[qi]=w;
  setTimeout(()=>{
    qi++;
    if(qi<Q[mode].length){renderQ();}
    else{$('progBar').style.width='100%';show('loading');setTimeout(showResult,1500);}
  },230);
}
function prevQ(){if(qi===0){show('intro');return}qi--;renderQ()}

/* 각 축 앞 글자(E,S,T,J) 비율: 5~95% */
function calc(){
  const sum=[0,0,0,0],n=[0,0,0,0],last=[0,0,0,0];
  Q[mode].forEach((q,i)=>{sum[q.ax]+=answers[i];n[q.ax]++;last[q.ax]=answers[i]});
  const pct=sum.map((s,i)=>{
    let p=Math.round(50+s/(2*n[i])*45);
    if(p===50)p=last[i]>0?52:48; // 동점이면 그 축의 마지막 답으로 결정
    return p;
  });
  const type=pct.map((p,i)=>p>50?AX[i].a:AX[i].b).join('');
  return {type,pct};
}

/* 편한 사람: 생각 방식(S/N)·생활 리듬(J/P)이 같고 에너지(E/I)는 반대
   맞춰가야 하는 사람: 생각 방식·생활 리듬이 반대이고 에너지는 같음 */
function flip(ch){return {E:'I',I:'E',S:'N',N:'S',T:'F',F:'T',J:'P',P:'J'}[ch]}
function partners(type){
  const easy=[],adj=[];
  ['T','F'].forEach(tf=>{
    easy.push(flip(type[0])+type[1]+tf+type[3]);
    adj.push(type[0]+flip(type[1])+tf+flip(type[3]));
  });
  return {easy,adj};
}

function axisBars(pct){
  return AX.map((a,i)=>`<div class="axis"><div class="lbl"><span><b>${a.a}</b> ${a.an} ${pct[i]}%</span><span>${100-pct[i]}% ${a.bn} <b>${a.b}</b></span></div><div class="bar"><div class="l" style="width:${pct[i]}%"></div><div class="r" style="width:${100-pct[i]}%"></div></div></div>`).join('');
}

function palCard(cls,label,types,desc){
  return `<div class="pal ${cls}"><div class="em">${types.map(t=>T[t].e).join('')}</div><div><span class="pill">${label}</span><br><b>${types.map(t=>`${t} ${T[t].n}`).join(' · ')}</b><small>${desc}</small></div></div>`;
}

function compareHTML(me,them){
  const who=MODES[mode].who;
  let same=0;
  const rows=AX.map((a,i)=>{
    const s=me.type[i]===them.type[i]; if(s)same++;
    const txt=s?CMP[i].same:CMP[i].diff[mode];
    return `<div class="cmp"><div class="h"><span>${a.topic} (${a.a}/${a.b})</span><span class="${s?'same':'diff'}">${s?'닮았어요':'달라요'}</span></div>
      <div class="row"><span class="who">${esc(nick)}</span><div class="bar"><div class="l" style="width:${me.pct[i]}%"></div><div class="r" style="width:${100-me.pct[i]}%"></div></div><span class="v">${me.type[i]}</span></div>
      <div class="row"><span class="who">${esc(them.name)}</span><div class="bar them"><div class="l" style="width:${them.pct[i]}%"></div><div class="r" style="width:${100-them.pct[i]}%"></div></div><span class="v">${them.type[i]}</span></div>
      <p>${txt}</p></div>`;
  }).join('');
  const diffSum=me.pct.reduce((s,p,i)=>s+Math.abs(p-them.pct[i]),0);
  const score=Math.max(40,Math.round(100-diffSum/360*60));
  const c=CHEM[same];
  return `<div class="card sec"><h3>💞 ${who}와 나, 함께 보기</h3>
    <div class="vs"><div class="p"><div class="e">${T[me.type].e}</div><div class="t">${me.type}</div><div class="n">${esc(nick)}</div></div>
    <div class="heart">${mode==='self'?'🤝':mode==='love'?'💗':'💍'}</div>
    <div class="p"><div class="e">${T[them.type].e}</div><div class="t">${them.type}</div><div class="n">${esc(them.name)}</div></div></div>
    <div class="chem"><div class="s">${score}%</div><div class="ttl">${c.t}</div><p class="muted" style="margin-top:4px">${c.d}</p></div>
    ${rows}</div>`;
}

function showResult(){
  const r=calc(),t=T[r.type],M=MODES[mode],p=partners(r.type);
  const who=M.who;
  const html=`
    ${invite?compareHTML(r,invite):''}
    <div class="card rhead">
      <span class="tag">${M.ic} ${M.title} · ${esc(nick)}님의 결과</span>
      <div class="char">${t.e}</div>
      <div class="type">${r.type}</div>
      <h2>${t.n}</h2>
      <p>${t.tag}</p>
    </div>
    <div class="card sec"><h3>📊 나의 성향 그래프</h3>${axisBars(r.pct)}</div>
    <div class="card sec"><h3>🌼 나는 이런 사람</h3><p>${t.d}</p><div class="chips">${t.kw.map(k=>`<span class="chip">#${k}</span>`).join('')}</div></div>
    <div class="card sec"><h3>${M.secIc} ${M.sec}</h3><p>${t[mode]}</p></div>
    <div class="card sec"><h3>🌧️ 스트레스 & 힐링</h3>
      <h4 style="margin-top:0">이럴 때 제일 힘들어요</h4>
      <ul>${t.stW.map(s=>`<li>${s}</li>`).join('')}</ul>
      <h4>💭 사실은요</h4>
      <div class="why"><p>${t.stD}</p></div>
      <h4>🍀 나를 회복시키는 것</h4>
      <div class="chips" style="margin-top:0">${t.heal.map(h=>`<span class="chip">🍀 ${h}</span>`).join('')}</div>
    </div>
    <div class="card sec"><h3>🫶 나와 함께하는 ${who}</h3>
      ${palCard('easy',`내가 편한 ${who}`,p.easy,'생각하는 방식과 생활 리듬이 비슷해서 말이 잘 통하고, 에너지는 반대라 서로를 자연스럽게 채워줘요.')}
      ${palCard('adj',`맞춰가야 하는 ${who}`,p.adj,'생각하는 방식과 생활 리듬이 달라서 처음엔 오해가 생기기 쉬워요. 하지만 맞춰갈수록 내 시야를 가장 넓혀주는 사람이에요.')}
      <p class="muted" style="margin-top:6px">※ 맞고 안 맞고가 아니라, 처음부터 편한지 · 서로 노력이 필요한지의 차이예요.</p>
    </div>
    <div class="share-box">
      <p>${invite?`나의 결과도 <b>${esc(invite.name)}</b>님에게 보내서<br>같이 비교 결과를 볼 수 있게 해주세요!`:`이 결과를 ${who}에게 보내보세요!<br>${who}가 테스트를 마치면 <b>우리 둘의 비교 결과</b>가 나와요.`}</p>
      <button class="btn" onclick="shareLink()">💌 ${who}에게 보내기</button>
      <div class="linkbox" id="linkbox"></div>
    </div>
    <div style="margin-top:14px">
      <button class="btn ghost" onclick="pickMode(mode)">🔁 다시 하기</button>
      <button class="btn ghost" onclick="goHome()">🏠 다른 테스트 해보기</button>
    </div>
    <footer>✿ 재미로 보는 테스트예요. 사람은 하나의 유형보다 훨씬 다채로워요 ✿</footer>`;
  window._last=r;
  $('result').innerHTML=html;show('result');
}

function shareLink(){
  const r=window._last;
  const url=`${location.origin}${location.pathname}?m=${mode}&n=${encodeURIComponent(nick)}&r=${r.type}-${r.pct.join('-')}`;
  const text=`${nick}님의 ‘${MODES[mode].title}’ 결과는 ${r.type} ${T[r.type].n}! 너도 해보고 우리 둘 비교해보자 💕`;
  if(navigator.share){navigator.share({title:'나를 알아가는 시간',text,url}).catch(()=>{});return}
  const done=()=>toast('링크가 복사됐어요! 붙여넣어 보내주세요');
  if(navigator.clipboard){navigator.clipboard.writeText(text+'\n'+url).then(done,()=>showLink(url))}else showLink(url);
}
function showLink(url){const b=$('linkbox');b.style.display='block';b.textContent=url}

/* 초대 링크로 들어온 경우 */
(function init(){
  const p=new URLSearchParams(location.search);
  const m=p.get('m'),n=p.get('n'),r=p.get('r');
  if(m&&MODES[m]&&r){
    const parts=r.split('-');const type=parts[0];const pct=parts.slice(1).map(Number);
    if(T[type]&&pct.length===4&&pct.every(x=>x>=0&&x<=100)){
      invite={name:(n||'친구').slice(0,10),type,pct};
      pickMode(m);
    }
  }
})();
</script>
</body>
</html>
